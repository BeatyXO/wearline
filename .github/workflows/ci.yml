name: ci

on:
  push:
  pull_request:

jobs:
  contract-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-test.txt
      - run: genvm-lint check contracts/Wearline.py
      - run: gltest tests/direct_mode_suite.py -q
      - run: python -m unittest tests/test_source_invariants.py -v
      - run: python scripts/check_stale_terms.py
      - run: python scripts/verify_demo_evidence.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
