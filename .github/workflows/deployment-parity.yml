name: deployment-parity

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deployment-parity.yml"
      - "scripts/verify_deployed_parity.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-deployed-source-and-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify StudioNet deployed source and schema parity
        env:
          GENLAYER_RPC: https://studio.genlayer.com/api
          WEARLINE_CONTRACT: 0x9229d28C3786821c5D005952d04A9ecf565E46fF
        run: python scripts/verify_deployed_parity.py
